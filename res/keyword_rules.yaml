    strong: ["tuần sinh hoạt công dân", "sinh hoạt công dân đầu khóa", "sinh hoạt công dân cuối khóa"]
    medium: ["bài thu hoạch", "học tập nội quy", "tuần lễ đầu khóa", "tuần sinh hoạt đầu khóa"]
    note: "Quy chế không cộng điểm; bỏ lỡ bị trừ 10–20 điểm → xử lý như sự kiện BẮT BUỘC (nhắc nhở), không phải đề xuất kiếm điểm."

  # ============================ KHÔNG TÍNH ĐIỂM ===============================
  NONE:
    decisive: ["không tính điểm rèn luyện", "không được cộng điểm rèn luyện", "khuyến mãi"]
    strong:
      - "giảm giá"
      - "mua 1 tặng 1"
      - "voucher"
      - "bán vé"
      - "giá vé"
      - "tiệc"
      - "party"
      - "cho thuê"
      - "sang nhượng"
      - "pass đồ"
      - "tìm trọ"
      - "tuyển dụng nhân viên"
      - "fan meeting"
    medium:
      - "đêm nhạc"
      - "concert"
      - "minigame"
      - "xem phim"
      - "du lịch"
      - "picnic"
      - "liên hoan"
      - "cổ vũ"
      - "trà sữa"
    weak: ["quảng cáo", "ưu đãi", "miễn phí vé"]
    note: "Đêm nhạc/giao lưu giải trí: quy chế không có mục cộng điểm → NONE hoặc hỏi lại, KHÔNG gán C3."

# -----------------------------------------------------------------------------
# ĐIỀU CHỈNH CHÉO GIỮA CÁC NHÃN (ưu tiên giải quyết các cặp dễ nhầm)
# if_any: có ít nhất 1 cụm | if_all: có đủ | if_none: không có cụm nào
# -----------------------------------------------------------------------------
adjust_rules:
  - id: A1
    why: "Hiến máu tình nguyện là mục riêng (4.2), không tính là tình nguyện viên chung (4.3)"
    if_any: ["hiến máu", "giọt hồng"]
    if_none: ["tình nguyện viên", "tnv"]
    label: C4.tinh_nguyen
    delta: -3.0
  - id: A2
    why: "Tình nguyện viên hỗ trợ hội thảo/workshop học thuật không phải tình nguyện vì cộng đồng (giới hạn: bài không dấu 'hoi thao' có thể là hội thao thể thao)"
    if_any: ["hội thảo", "workshop", "seminar", "tọa đàm", "talkshow", "hội nghị"]
    if_any_2: ["tình nguyện viên", "tnv", "cộng tác viên", "ctv"]
    label: C4.tinh_nguyen
    delta: -4.0
  - id: A3
    why: "Phục vụ lễ/ngày hội của Trường → 3.3 thay vì 4.3"
    if_any: ["lễ khai giảng", "lễ tốt nghiệp", "ngày hội việc làm", "tư vấn tuyển sinh", "open day"]
    if_any_2: ["tình nguyện viên", "tnv", "cộng tác viên", "ctv"]
    label: C4.tinh_nguyen
    delta: -3.0
  - id: A4
    why: "Bài nhắc tới điểm rèn luyện thì ít khả năng là NONE"
    if_any: ["điểm rèn luyện", "đrl", "cộng điểm rl", "điểm rl"]
    label: NONE
    delta: -4.0
  - id: A5
    why: "Lịch sử Đảng/Việt Nam → 3.1; lịch sử Trường/Đoàn/Hội → 3.9"
    if_any: ["lịch sử phát triển nhà trường", "truyền thống nhà trường", "lịch sử hình thành"]
    label: C3.cuoc_thi_ct_vhvn_tdtt
    delta: -3.0
  - id: A6
    why: "Hội thảo khoa học dạng đăng ký đề tài NCKH không phải sinh hoạt hội thảo"
    if_any: ["đăng ký đề tài", "đề tài nckh", "cuộc thi nghiên cứu khoa học"]
    label: C1.sinh_hoat_hoc_thuat
    delta: -2.0
  - id: A7
    why: "Cuộc thi tìm hiểu Hiến pháp/pháp luật thuộc 4.6, không thuộc 3.1"
    if_any: ["hiến pháp", "pháp luật"]
    label: C3.cuoc_thi_ct_vhvn_tdtt
    delta: -2.0
  - id: A8
    why: "Quảng cáo thương mại kèm khóa học/kỹ năng: không phải sinh hoạt học thuật của Trường"
    if_any: ["khuyến mãi", "giảm giá", "học phí ưu đãi", "đăng ký ngay để nhận ưu đãi"]
    label: C1.sinh_hoat_hoc_thuat
    delta: -4.0
  - id: A9
    why: "Giải chạy gây quỹ: chủ yếu 3.2 nhưng cũng liên quan 4.5 — giữ cả hai trong top-2 (xem confusable_pairs)"
    if_all: ["chạy", "gây quỹ"]
    label: C3.chung_nhan_the_luc
    delta: 1.5

# -----------------------------------------------------------------------------
# TỪ ĐỒNG ÂM KHI BỎ DẤU — phải xử lý riêng, nếu không sẽ nhầm nhãn
#   "hội thảo" (seminar → C1.1.9) và "hội thao" (sports meet → C3.3.1) đều thành "hoi thao".
# Cách làm:
#   * Bài CÓ dấu: so khớp theo dạng có dấu → chọn đúng biến thể.
#   * Bài KHÔNG dấu: dựa vào từ ngữ cảnh (context_any); không có ngữ cảnh → cộng điểm cho
#     CẢ HAI biến thể để hai nhãn gần nhau và bài được đánh dấu "review".
# -----------------------------------------------------------------------------
homographs:
  - stripped: "hội thao"
    weight: strong
    variants:
      - text: "hội thảo"
        label: C1.sinh_hoat_hoc_thuat
        context_any: ["khoa học", "chuyên đề", "báo cáo", "diễn giả", "seminar", "workshop", "công nghệ", "ai", "nghiên cứu", "kỹ năng"]
      - text: "hội thao"
        label: C3.cuoc_thi_ct_vhvn_tdtt
        context_any: ["thể thao", "bóng", "giải", "cup", "thi đấu", "vận động viên", "chạy", "cờ", "đội"]

# -----------------------------------------------------------------------------
# TIÊN NGHIỆM THEO ĐƠN VỊ TỔ CHỨC (regex trên tên đơn vị đã chuẩn hóa)
# Chỉ cộng nhẹ; không bao giờ đủ để một mình quyết định nhãn.
# -----------------------------------------------------------------------------
organizer_priors:
  - match: ["phong cong tac sinh vien", "(^| )ctsv( |$)"]
    boosts: {C2.khao_sat_dieu_tra: 0.5, P.sinh_hoat_cong_dan: 0.5, C2.danh_gia_mon_hoc: 0.3}
  - match: ["doan truong", "doan thanh nien", "thanh doan"]
    boosts: {C4.tinh_nguyen: 0.5, C3.cuoc_thi_ct_vhvn_tdtt: 0.5, C4.tuyen_truyen_phap_luat: 0.3}
  - match: ["hoi sinh vien"]
    boosts: {C4.tinh_nguyen: 0.5, C3.cuoc_thi_ct_vhvn_tdtt: 0.5, C4.quyen_gop: 0.3}
  - match: ["lien chi hoi", "lien chi doan"]
    boosts: {C3.cuoc_thi_ct_vhvn_tdtt: 0.3, C4.tinh_nguyen: 0.3, C3.hoat_dong_cap_lop: 0.3}
  - match: ["chi doan", "chi hoi", "ban can su lop"]
    boosts: {C3.hoat_dong_cap_lop: 1.0}
  - match: ["(^| )khoa (?!hoc )", "bo mon", "clb hoc thuat", "cau lac bo hoc thuat"]
    boosts: {C1.sinh_hoat_hoc_thuat: 0.5, C1.cuoc_thi_hoc_thuat: 0.5, C1.de_tai_nckh: 0.3}
  - match: ["phong dao tao", "phong khao thi"]
    boosts: {C2.danh_gia_mon_hoc: 0.5}
  - match: ["quan he doanh nghiep"]
    boosts: {C3.tu_van_tuyen_sinh_viec_lam: 0.5, C1.sinh_hoat_hoc_thuat: 0.3}

# -----------------------------------------------------------------------------
# CẶP NHÃN DỄ NHẦM — khi cả hai đều có tín hiệu, hạ trạng thái xuống "review"
# và đưa cả hai vào top-2 để người dùng/tầng 2 quyết định
# -----------------------------------------------------------------------------
confusable_pairs:
  - [C3.chung_nhan_the_luc, C4.quyen_gop, "Giải chạy gây quỹ từ thiện: 3.2 hay 4.5"]
  - [C4.tinh_nguyen, C4.hien_mau, "Chương trình tình nguyện có hiến máu"]
  - [C1.sinh_hoat_hoc_thuat, C1.de_tai_nckh, "Hội thảo NCKH sinh viên"]
  - [C1.cuoc_thi_hoc_thuat, C3.cuoc_thi_ct_vhvn_tdtt, "Cuộc thi chung chung"]
  - [C3.dai_bieu_duoc_tuyen_chon, C3.dai_bieu_tu_ung_tuyen, "Chương trình quốc tế: được cử hay tự ứng tuyển"]
  - [C3.huy_dong_luc_luong, C4.tinh_nguyen, "Hỗ trợ sự kiện: huy động lực lượng hay tình nguyện"]
  - [C3.san_pham_truyen_thong, C3.cuoc_thi_ct_vhvn_tdtt, "Cuộc thi video/ảnh"]
  - [C2.khao_sat_dieu_tra, C3.gop_y_van_ban, "Lấy ý kiến sinh viên"]

# -----------------------------------------------------------------------------
# THUỘC TÍNH SUY RA (không phải nhãn): cấp tổ chức, vai trò, thời lượng, điểm công bố
# Trích tường minh là việc của Module 2; phần này là dự phòng khi M2 để trống.
# Cấp trả về dạng mịn; đổi sang bucket điểm (lop / khoa / truong_tro_len) theo
# rubric.yaml → level_buckets.
# -----------------------------------------------------------------------------
attributes:
  level:
    # Kiểm tra từ cao xuống thấp; chỉ dùng cụm CÓ "cấp"/phạm vi rõ ràng để tránh nhầm
    # (tên trường "ĐH KHTN, ĐHQG-HCM" xuất hiện ở hầu hết bài nên KHÔNG dùng làm tín hiệu).
    quoc_te: ["quốc tế", "international", "asean", "toàn cầu"]
    quoc_gia: ["toàn quốc", "cấp quốc gia", "trung ương"]
    thanh_pho: ["cấp thành phố", "cấp thành", "thành đoàn", "hội sinh viên thành phố", "toàn thành"]
    dhqg: ["cấp đhqg", "cấp đại học quốc gia", "đoàn đhqg", "hội sinh viên đhqg", "liên trường"]
    truong: ["cấp trường", "toàn trường", "đoàn trường", "hội sinh viên trường", "toàn thể sinh viên trường"]
    khoa: ["cấp khoa", "toàn khoa", "liên chi đoàn", "liên chi hội", "khoa tổ chức", "sinh viên khoa"]
    lop: ["cấp lớp", "chi đoàn", "chi hội", "ban cán sự lớp", "sinh hoạt lớp", "tập thể lớp"]
  role:
    organizer: ["ban tổ chức", "btc", "tuyển ban tổ chức", "thành viên ban tổ chức"]
    collaborator: ["cộng tác viên", "ctv"]
    volunteer: ["tình nguyện viên", "tnv"]
  # Dùng cụm cụ thể: "tuyển" bỏ dấu thành "tuyen" trùng "tuyên (truyền)".
  recruitment_cues: ["tuyển thành viên", "tuyển ban tổ chức", "tuyển cộng tác viên", "tuyển ctv", "tuyển btc",
                     "tuyển tình nguyện viên", "tuyển tnv", "chiêu mộ", "mở đơn", "đăng ký làm"]
  duration:
    # Dùng cho mục 4.3 (tình nguyện) — chỉ là GỢI Ý, giờ làm việc thực tế do M2/người dùng xác nhận
    unit_patterns: ["(\\d+)\\s*(gio|ngay|tuan|thang)"]
    rules:
      - {unit: [tuan, thang], result: ge_1w}
      - {unit: ngay, ge: 7, result: ge_1w}
      - {unit: ngay, ge: 2, lt: 7, result: ambiguous_lt_24h_or_mid}
      - {unit: ngay, eq: 1, result: lt_24h}
      - {unit: gio, result: lt_24h}
    priors:
      - {phrase: "mùa hè xanh", result: ge_1w, confidence: low}
  explicit_points:
    # Dự phòng cho M2: bắt cụm công bố điểm rèn luyện (đã chuẩn hóa không dấu)
    cong_diem: "cong\\s+(\\d+)\\s+diem\\s+(?:ren\\s+luyen|rl|drl)"
    so_diem: "(\\d+)\\s+diem\\s+ren\\s+luyen"
    nhac_den_drl: ["diem ren luyen", "drl", "diem rl"]
    phu_dinh: "khong\\s+(?:duoc\\s+)?(?:tinh|cong)\\s+diem\\s+ren\\s+luyen"
