# =============================================================================
# keyword_rules.yaml — Luật từ khóa (TẦNG 0) cho phân loại mục ĐRL
# Dựa trên rubric.yaml (khtn-qd1028-2020-v1): 21 nhãn sự kiện + NONE + P.sinh_hoat_cong_dan.
#
# CÁCH HOẠT ĐỘNG (tóm tắt)
#   1. Chuẩn hóa văn bản: chữ thường, bỏ dấu, đ→d, bỏ ký tự đặc biệt.
#      => viết từ khóa CÓ DẤU cho dễ đọc; code tự chuẩn hóa khi nạp.
#   2. Mỗi từ khóa khớp theo CỤM TỪ NGUYÊN VẸN (không khớp nửa chừng một từ).
#   3. Mỗi nhãn cộng điểm theo độ mạnh của từ khóa tìm thấy (mỗi cụm chỉ tính 1 lần):
#        decisive 6.0 | strong 3.0 | medium 1.5 | weak 0.5
#      Cụm nằm trong TIÊU ĐỀ được nhân 1.5.
#   4. Trừ điểm nếu gặp từ phủ định (negative); điều chỉnh chéo bằng adjust_rules.
#   5. Nhãn chỉ được coi là "có tín hiệu" khi điểm >= min_score_to_fire (2.0);
#      không nhãn nào đạt ngưỡng → trả None để tầng 1/2 xử lý (không bỏ phiếu bừa).
#
# LƯU Ý TRUNG THỰC
#   * Đây là bộ luật khởi điểm, soạn từ lời văn quy chế + cách đặt tên sự kiện
#     phổ biến. CHƯA được kiểm chứng trên bài đăng thật của trường. Bước tiếp theo
#     bắt buộc: chạy trên 100–150 bài thật, đọc các ca sai, rồi chỉnh danh sách.
#   * Từ khóa càng ngắn/chung (vd "khảo sát", "cuộc thi") càng dễ gây nhầm →
#     chỉ để mức medium/weak hoặc yêu cầu đi kèm từ khác (combos).
#   * Quy chế KHÔNG cộng điểm cho việc chỉ "xem/cổ vũ/dự đêm nhạc"; chỉ cộng cho
#     cuộc thi, hoạt động có tham gia thực chất (xem rubric). Luật phản ánh điều này.
# =============================================================================

version: "kw-v1"
rubric_version: "khtn-qd1028-2020-v3-mvp"
status: "draft — cần kiểm thử trên bài đăng thật"

normalization:
  lowercase: true
  strip_diacritics: true
  map_d: true                       # đ → d
  non_alnum_to_space: true
  collapse_whitespace: true

scoring:
  weights: {decisive: 6.0, strong: 3.0, medium: 1.5, weak: 0.5}
  title_multiplier: 1.5
  negative_penalty: 3.0             # mỗi từ phủ định tìm thấy
  min_score_to_fire: 2.0
  max_label_score: 12.0             # chặn cộng dồn quá mức do cụm lồng nhau
  softmax_beta: 1.5                 # đổi điểm → phân phối xác suất thô
  organizer_prior_scale: 1.0
  confusable_margin: 2.0            # top1 − top2 < margin (cả hai đã "fire") → cờ review

