meta_labels:
  NONE:
    aliases: ["NO_MATCH"]
    name: "Không tính điểm rèn luyện (NONE / NO_MATCH)"
    is_rubric_criterion: false
    description: "Sự kiện/bài đăng không thuộc mục nào của Phụ lục: giải trí thuần túy cá nhân, thương mại, quảng cáo, tuyển dụng part-time ngoài trường."
    school_data:
      rows: 0
      support: none
      note: "events_full.csv chỉ chứa các dòng được ghi nhận ĐRL (không có ví dụ âm cho NONE/NO_MATCH — xem Q17)."
    inclusion_rules:
      - "Quảng cáo thương mại, khuyến mãi/voucher/bán vé giải trí, tiệc liên hoan cá nhân ngoài kế hoạch Đoàn–Hội, tin tuyển dụng việc làm thêm ngoài trường, khóa học kỹ năng thương mại của trung tâm bên ngoài."
    exclusion_rules:
      - "Cẩn trọng với các từ khóa 'party', 'tất niên', 'liên hoan': 'Watch Party NVIDIA GTC 2026' (dòng 61) thuộc mục 1.9; 'Chương trình kỷ niệm 96 năm thành lập Đảng Cộng sản Hồ Chí Minh và Tất niên cán bộ' (dòng 127) thuộc mục 3.5."
      - "Tin 'Ngày hội việc làm' do Khoa/Trường tổ chức (dòng 133–134) thuộc mục 3.8, không phải quảng cáo tuyển dụng NONE."
    anchors_status: draft
    anchors:
      - "Tiệc liên hoan cuối năm của lớp"
      - "Quảng cáo khóa học kỹ năng của trung tâm bên ngoài"
      - "Khuyến mãi, bán vé sự kiện giải trí thương mại"
      - "Buổi gặp mặt giao lưu giải trí không nằm trong kế hoạch của Đoàn - Hội"
    keywords: ["khuyến mãi", "giảm giá", "mua vé", "giá vé", "voucher", "quảng cáo", "tuyển dụng việc làm part-time", "liên hoan tự phát", "tiệc cá nhân"]
    negative_keywords: ["watch party", "tất niên cán bộ", "ngày hội việc làm", "đoàn thanh niên", "hội sinh viên"]

  NEEDS_REVIEW:
    name: "Cần kiểm duyệt / Chưa đủ chắc chắn để gán nhãn tự động"
    is_rubric_criterion: false
    maps_to_classifier_status: "pending_review"
    description: "Nhãn định tuyến (routing/gating) khi văn bản có độ tin cậy thấp, khoảng cách top-1 và top-2 hẹp, thiếu ngữ cảnh vai trò/đơn vị/huy động lực lượng, hoặc rơi vào các cặp mục chồng lấn trong dữ liệu trường."
    school_data:
      note: "Không phải mục tính điểm trong Module 6; Module 3 đưa vào hàng đợi kiểm duyệt trước khi gán mục ĐRL chính thức."
    trigger_conditions:
      - "Độ tin cậy hiệu chỉnh dưới ngưỡng chấp nhận hoặc Stage 1 / Stage 2 xung đột (D-2)."
      - "Tiêu đề trùng giữa vai trò Tham gia và Ban tổ chức nhưng thiếu thông tin Vai_Tro (1.6 vs 1.7, 3.5 vs 3.14, 4.3 vs 4.4)."
      - "Thiếu dấu hiệu xác nhận 'Huy động lực lượng' trên sự kiện có thể rơi vào 3.3 vs 3.5 / 1.9 / 3.1."
      - "Thiếu thông tin cấp tổ chức hoặc đơn vị trên cuộc thi chính trị/pháp luật/văn hóa/an ninh mạng (3.1 vs 3.5 vs 4.6)."
      - "Workshop/talkshow/chuyên đề/tham quan không rõ tính học thuật-nghề nghiệp (1.9) hay phong trào-cảm xúc-thủ công (3.5)."
      - "Hoạt động tình nguyện có yếu tố quyên góp/gây quỹ (4.3 vs 4.5) hoặc Chủ nhật xanh (3.5 vs 4.3)."
      - "Bài đăng dạng kết quả/danh sách/vinh danh ('Danh sách...', 'Thành tích...') thay vì lời kêu gọi tham gia (post_types.result_announcement)."
    known_confusable_pairs_from_school_data:
      - [C3.cuoc_thi_ct_vhvn_tdtt, C3.hoat_dong_cap_lop, "3.1 vs 3.5: cuộc thi/quiz trực tuyến cùng chủ đề (Nghị quyết 57, văn hóa quốc tế, nội quy, pháp luật, an ninh mạng)"]
      - [C1.sinh_hoat_hoc_thuat, C3.hoat_dong_cap_lop, "1.9 vs 3.5: workshop/tọa đàm/tham quan học thuật-nghề nghiệp vs phong trào-cảm xúc-thủ công"]
      - [C1.cuoc_thi_hoc_thuat, C1.sinh_hoat_hoc_thuat, "1.6 vs 1.9: thi đấu/thi thử/chọn đội tuyển vs hội thảo/Unitour/ôn tập"]
      - [C3.huy_dong_luc_luong, C3.hoat_dong_cap_lop, "3.3 vs 3.5/1.9: phân biệt qua trạng thái Huy động lực lượng (vd HCMUS Future Leaders)"]
      - [C4.tinh_nguyen, C4.quyen_gop, "4.3 vs 4.5: tình nguyện viên tiếp nhận quyên góp (dòng 139) vs gây quỹ hoạt động tình nguyện (dòng 145)"]
      - [C4.tuyen_truyen_phap_luat, C3.cuoc_thi_ct_vhvn_tdtt, "4.6 vs 3.1/3.5: tuyên truyền pháp luật/an ninh mạng trong trường hiện nằm ở 3.1 và 3.5"]
      - [C1.cuoc_thi_hoc_thuat, C1.btc_cuoc_thi_hoc_thuat, "1.6 vs 1.7 (và 3.5 vs 3.14, 4.3 vs 4.4): trùng tiêu đề khi khác Vai_Tro"]

