# -----------------------------------------------------------------------------
# NHÃN ĐẶC BIỆT CHO BỘ PHÂN LOẠI
# -----------------------------------------------------------------------------
meta_labels:
  NONE:
    name: "Không tính điểm rèn luyện"
    description: "Sự kiện/bài đăng không thuộc mục nào của Phụ lục: giải trí thuần túy, thương mại, quảng cáo."
    anchors_status: draft
    anchors:
      - "Tiệc liên hoan cuối năm của lớp"
      - "Quảng cáo khóa học kỹ năng của trung tâm bên ngoài"
      - "Khuyến mãi, bán vé sự kiện giải trí thương mại"
      - "Buổi gặp mặt giao lưu giải trí không nằm trong kế hoạch của Đoàn - Hội"
    keywords: ["khuyến mãi", "giảm giá", "mua vé", "tiệc", "liên hoan", "quảng cáo", "tuyển dụng việc làm part-time"]

# -----------------------------------------------------------------------------
# QUY TẮC CHUNG (Điều 7, Điều 8, Điều 9)
# -----------------------------------------------------------------------------
global_rules:
  classification:                    # Điều 7
    - {label: xuat_sac, name: "Xuất sắc", from: 90, to: 100}
    - {label: tot, name: "Tốt", from: 80, to: 89}
    - {label: kha, name: "Khá", from: 65, to: 79}
    - {label: trung_binh, name: "Trung bình", from: 50, to: 64}
    - {label: yeu, name: "Yếu", from: 35, to: 49}
    - {label: kem, name: "Kém", from: null, to: 35, to_inclusive: false}
  classification_note: "Quy chế dùng các khoảng nguyên (vd 80–89, 65–79); cách xếp loại điểm không nguyên (vd 89,5) cần CTSV xác nhận."
  discipline_effects:                # Điều 8.1–8.4
    khien_trach: {max_classification: kha, note: "Trong thời gian bị kỷ luật khiển trách, kết quả không vượt quá loại Khá"}
    canh_cao: {max_classification: trung_binh, note: "Trong thời gian bị kỷ luật cảnh cáo, kết quả không vượt quá loại Trung bình"}
    dinh_chi_hoc_tap: {evaluated: false, note: "Không đánh giá trong thời gian bị đình chỉ"}
    buoc_thoi_hoc: {evaluated: false}
  special_cases:                     # Điều 8.5–8.9
    nghi_hoc_tam_thoi_hoac_khong_dang_ky_hoc_phan: {fixed_score: 50, classification: trung_binh}
    hai_chuong_trinh: "Đánh giá tại đơn vị quản lý chương trình thứ nhất, lấy nhận xét đơn vị thứ hai làm căn cứ"
    chuyen_truong: "Được bảo lưu kết quả rèn luyện nếu được Hiệu trưởng hai cơ sở đồng ý"
    tot_nghiep_tre_tien_do: "Không vi phạm pháp luật/không bị kỷ luật thì không áp điểm trừ trong học kỳ trễ tiến độ; chưa đủ điều kiện tốt nghiệp thì không đánh giá"
    uu_tien_hoan_canh_dac_biet: "Sinh viên khuyết tật/mồ côi/hoàn cảnh đặc biệt khó khăn có xác nhận của địa phương được ưu tiên, khuyến khích, cộng điểm"
    truong_hop_khac: "Hội đồng đánh giá cấp Trường xem xét và quyết định (Điều 8.12)"
  course_level_bonuses:              # Điều 8.10–8.11: cộng vào điểm toàn khóa, KHÔNG vào điểm học kỳ
    thu_khoa_dau_ra: {points: 10, scope: toan_khoa, condition: "Không vi phạm kỷ luật trong toàn bộ quá trình học"}
    giai_quoc_gia_tro_len: {points: 5, scope: toan_khoa, condition: "Đạt giải kỳ thi cấp Quốc gia trở lên và không vi phạm nội quy, quy chế hoặc bị kỷ luật trong toàn bộ quá trình học"}
  process:                           # Điều 9 — hữu ích cho Module 5 (nhắc việc)
    sinh_vien_tu_danh_gia: "Mỗi học kỳ, sinh viên tự đánh giá theo Phụ lục"
    don_vi_cap_nhat: "Cuối mỗi tháng và cuối mỗi học kỳ, Khoa/Đoàn thanh niên/Hội Sinh viên cập nhật thành tích và danh sách tham gia"
    phan_hoi_trong_ngay: 15          # kể từ khi CTSV công bố kết quả dự kiến qua email sinh viên
    cong_bo_chinh_thuc: "Qua email sinh viên và hệ thống theo dõi điểm rèn luyện"

# -----------------------------------------------------------------------------
# CÁC CÂU HỎI ĐÃ ĐƯỢC TRẢ LỜI (để truy vết quyết định)
# -----------------------------------------------------------------------------
resolved_questions:
  - {id: Q1, topic: "Hiệu lực văn bản", answer: "Quy chế đã hết hiệu lực nhưng dùng làm cơ sở cho MVP đồ án", applied_in: "meta.validity"}
  - {id: Q2, topic: "Điểm sàn học kỳ", answer: "Điểm trừ không giới hạn; điểm học kỳ thấp nhất là 0", applied_in: "scoring.floor, scoring.formula"}
  - {id: Q3, topic: "Thứ tự áp trần và điểm trừ", answer: "Áp trần từng nhóm trước, sau đó mới trừ điểm", applied_in: "scoring.formula_status"}
  - {id: Q4, topic: "Mục 1.2 / 1.3", answer: "1.2 là ĐTB học kỳ; 1.3 là xếp loại học tập", applied_in: "C1.diem_trung_binh_hoc_ky, C1.giu_xep_loai_xuat_sac"}
  - {id: Q5, topic: "Mục không ghi đơn vị", answer: "Mỗi hoạt động cộng 1 lần; nhiều hoạt động được nhưng tổng bị chặn bởi trần nhóm lớn", applied_in: "scoring.repeat_rule; mục 3.2, 3.4, 3.6, 4.2, 5.3"}
  - {id: Q6, topic: "Cộng tác viên cấp lớp", answer: "Tạm thời không tính điểm (0)", applied_in: "C3.btc_ctv_hoat_dong, C4.btc_ctv_tinh_nguyen"}
  - {id: Q7, topic: "Mục 5.3 'cấp thành'", answer: "Đúng, là cấp thành phố", applied_in: "C5.doi_tuyen_giai_thuong_cap_thanh"}
  - {id: Q4b, topic: "Mục 1.4", answer: "Dùng ĐTB học kỳ (như mục 1.2)", applied_in: "C1.tang_diem_trung_binh"}
  - {id: Q8, topic: "Quy đổi cấp", answer: "Cấp ĐHQG, thành phố, quốc gia, quốc tế tính chung là 'cấp trường trở lên'", applied_in: "level_buckets"}

decisions:
  - {id: D1, topic: "Giả định mặc định cho nhóm tuân thủ", decision: "Mặc định coi là KHÔNG vi phạm (mục 1.1, 2.1, 3.7, 4.1); sinh viên có thể tắt", applied_in: "default_assumption, capabilities.ledger.baseline"}
  - {id: D2, topic: "Chức năng tự khai báo", decision: "Tự khai báo hoạt động/thành tích/minh chứng sẽ mở rộng sau MVP", applied_in: "mvp_scope: track_later; post_types.result_announcement: deferred", note: "Người soạn suy ra bài kết quả/vinh danh cũng để sau; điều chỉnh nếu hiểu sai"}

# -----------------------------------------------------------------------------
# CÂU HỎI CÒN MỞ
# -----------------------------------------------------------------------------
open_questions:
  - id: Q9
    topic: "Nguồn dữ liệu minh chứng"
    question: "Danh sách sinh viên tham gia sự kiện do Khoa/Đoàn/Hội cập nhật theo kênh nào (file, hệ thống)? Có API/biểu mẫu nào để Module 6–7 đối chiếu không? (người dùng sẽ cung cấp sau)"

# -----------------------------------------------------------------------------
# VIỆC CẦN LÀM TIẾP
# -----------------------------------------------------------------------------
next_steps:
  - "Thay `anchors` (bản nháp) bằng 3–8 tiêu đề sự kiện THẬT của trường cho mỗi mục có event_matchable: true (lấy từ fanpage Đoàn–Hội, khoa, CTSV)."
  - "Rà `keywords` với bài đăng thật (xem keyword_rules.yaml) để loại từ gây nhầm."
  - "Trả lời Q9, sau đó đổi meta.status thành confirmed."
  - "Khi làm chức năng tự khai báo: chuyển các mục mvp_scope=track_later sang self_reported và dùng post_types.result_announcement để gợi ý ghi nhận thành tích."
