# =============================================================================
# rubric.yaml — Khung điểm rèn luyện (ĐRL) dạng cấu hình cho Module 3 (và M6)
# Nguồn quy chế nền: Quy chế đánh giá kết quả rèn luyện sinh viên hệ chính quy,
#        Trường ĐH Khoa học Tự nhiên, ĐHQG-HCM — QĐ 1028/QĐ-KHTN-CTSV ngày
#        04/9/2020 (Điều 1–12 + Phụ lục "Khung điểm chi tiết", đã hết hiệu lực,
#        dùng làm khung tham chiếu MVP).
# Nguồn dữ liệu thực tế: res/events_full.csv (153 dòng đã gán nhãn năm học 2025–26).
#
# CÁCH ĐỌC FILE NÀY
#   scoring        Quy tắc tính tổng (trần 100, trần theo nhóm, điểm trừ)
#   groups         5 nhóm cộng điểm (C1–C5) + nhóm điểm trừ (P)
#   tieu_chi       13 tiêu chí của quy chế (TC1–TC13), mỗi tiêu chí thuộc 1 nhóm
#   levels/roles   Từ vựng chuẩn cho "cấp tổ chức" và "vai trò"
#   items          Từng dòng của Phụ lục = 1 mục (item). Trường của mỗi item:
#     ref            số mục trong Phụ lục (để truy vết, vd "4.2")
#     group, tieu_chi  nhóm C1–C5/P và tiêu chí
#     kind           event | task | mandatory_event | membership | compliance |
#                    record | status | achievement | special_circumstance |
#                    penalty (điểm trừ) |
#                    role_variant (cách tính cho BTC/CTV của các mục khác)
#     event_matchable  true = bài đăng/thông báo sự kiện có thể gắn nhãn trực tiếp;
#                    false = mục hồ sơ/tuân thủ/thành tích/tư cách thành viên/điểm trừ
#                    hoặc role_variant (cần tách phân loại hoạt động khỏi xác nhận vai trò)
#     variant_by     biến chọn dòng điểm: none | level | duration | award_tier |
#                    outcome | band
#     points         {vai_trò: {biến_thể: điểm}}  (điểm trừ là số âm)
#     bands          bảng khoảng giá trị (cho item kind=record)
#     unit           flat | per_semester | per_activity | per_round (đợt) |
#                    per_item (đề tài/bài/dự án/giải) | per_occurrence (lần)
#     repeatable     true/false; null = quy chế không nói rõ
#     role_items     vai trò → item dùng để tính điểm khi sinh viên là BTC/CTV
#     role_alias     vai trò suy ra được → vai trò có trong bảng điểm
#     requires_role_context  true ở role_variant: tránh khớp nhầm theo tiêu đề với mục gốc
#     evidence       minh chứng/xác nhận mà quy chế nêu (cho Module 7)
#     tier           1–5: khả năng của hệ thống với mục này (xem `capabilities.tiers`)
#     mvp_scope      recommend | recommend_apply | assumed_default | remind | track_later | out_of_scope
#     verification   none = hiện chưa có cách xác nhận (xem `capabilities.verification`)
#     default_assumption  chỉ có ở mục tuân thủ: mặc định coi là đạt, sinh viên có thể tắt
#     school_data    thống kê đầy đủ từ events_full.csv (rows, support, csv_rows, organizers, roles_seen, evidence_examples)
#     uncertain      các điểm CHƯA CHẮC (thiếu dữ liệu, mâu thuẫn giữa CSV 2025–26 và QĐ 1028/2020…)
#     scope_note     phạm vi thực tế của mục theo dữ liệu trường và quy chế
#     inclusion_rules / exclusion_rules / confusable_with  quy tắc biên phân loại cho kNN & prototype ngữ nghĩa
#     cap_points     trần điểm của mục (nếu trường ghi thấp hơn bảng điểm)
#     conditions     điều kiện kèm theo (chuỗi văn bản)
#     exclusive_with các item không được cộng đồng thời / chỉ tính mức cao nhất
#     anchors_status verified_from_school_list | verified_partial | draft
#     anchors, keywords  dữ liệu prototype/từ khóa cho phân loại (tách riêng verified_anchors / draft_anchors khi partial)
#   meta_labels    nhãn đặc biệt cho bộ phân loại: NONE (aliases: [NO_MATCH]) và NEEDS_REVIEW
#   global_rules   Quy tắc ở Điều 7–9 (xếp loại, hạn chế do kỷ luật, cộng toàn khóa)
#
# LƯU Ý TRUNG THỰC
#   * Không tự bịa ví dụ sự kiện, không sửa âm thầm nhãn đã kiểm chứng (kể cả 3.7),
#     không thay đổi quy tắc tính điểm của quy chế hay khẳng định QĐ 2020 còn hiệu lực.
#   * Phân loại một bài đăng vào một mục KHÔNG đồng nghĩa chứng minh sinh viên đã
#     tham gia, giữ vai trò tương ứng, hay đủ điều kiện nhận điểm.
#   * Mọi dữ liệu chưa kiểm chứng đều giữ nguyên ở `uncertain`, `anchors_status: draft`,
#     và `open_questions`.
# =============================================================================

meta:
  version: "khtn-2025-26-verified-v5-mvp"
  school: "Trường Đại học Khoa học Tự nhiên, ĐHQG-HCM"
  source_document: "Quy chế đánh giá kết quả rèn luyện sinh viên hệ chính quy — QĐ 1028/QĐ-KHTN-CTSV ngày 04/9/2020"
  source_file: "res/drl2025.md"
  applies_to: "Sinh viên đại học, cao đẳng hệ chính quy"
  status: "mvp — đã tinh chỉnh ranh giới tiêu chí, truy vết anchors/evidence theo events_full.csv (153 dòng, 26/51 mục), bổ sung NEEDS_REVIEW & tách phân loại khỏi xác nhận vai trò/tính điểm; còn điểm chưa chắc ở open_questions"
  data_source:
    baseline_rubric: "rubric(5).yaml (khtn-2025-26-verified-v4-mvp)"
    school_verified_list: "res/events_full.csv (153 dòng, 26/51 mã mục có dữ liệu, năm học 2025–26)"
    precedence: "Khi mâu thuẫn, dữ liệu quan sát trong events_full.csv được ghi nhận ưu tiên về mặt phạm vi thực tế, nhưng không tự ý xóa quy tắc điểm của QĐ 1028/2020 khi chưa có xác nhận chính thức từ CTSV."
  validity:
    state: expired
    used_for: "MVP đồ án Computational Thinking"
    note: "QĐ 1028/QĐ-KHTN-CTSV (2020) đã hết hiệu lực nhưng được dùng làm khung điểm cho MVP. Khi áp dụng thật phải đối chiếu với quy chế đang hiệu lực."
  language: vi

# -----------------------------------------------------------------------------
# QUY TẮC TÍNH TỔNG (Điều 4, Điều 6)
# -----------------------------------------------------------------------------
scoring:
  period: hoc_ky_chinh              # mỗi đợt đánh giá = 1 học kỳ chính (Điều 4.5)
  period_note: "Chương trình đại trà: không tính học kỳ hè. Chương trình theo đề án: 3 học kỳ/năm học."
  total_max: 100
  group_max_sum: 130                # 30+20+25+25+30 > 100 → áp quy tắc quy về 100
  overflow_rule: "Tổng điểm các nội dung > 100 thì quy về 100 (Điều 4.4)"
  caps_level: group_only            # quy chế chỉ có trần theo NHÓM; không có trần theo từng mục/tiêu chí
  penalties_unlimited: true         # điểm trừ không giới hạn (Điều 4.2.f)
  floor: 0                          # điểm học kỳ thấp nhất là 0 (người dùng xác nhận — Q2)
  formula: >
    raw = Σ_nhóm C1..C5 min(Σ điểm cộng của nhóm, max_nhóm) + Σ điểm trừ (số âm);
    điểm_học_kỳ = clamp(raw, 0, 100)
  formula_status: "confirmed — áp trần từng nhóm trước rồi mới trừ điểm; điểm trừ không giới hạn; sàn 0, trần 100 (Q2, Q3)"
  repeat_rule: >
    Mỗi hoạt động được cộng 1 lần; một mục có thể có nhiều hoạt động, tổng điểm bị chặn bởi trần
    của nhóm lớn (Q5). Áp dụng cả cho các mục quy chế không ghi đơn vị (3.2, 3.4, 3.6, 4.2, 5.3).
  display_policy: "MVP chỉ hiển thị điểm 'dự kiến' kèm nhãn 'Ước tính — chưa xác nhận'; không trình bày như điểm chính thức"
  aggregation:
    nam_hoc: "trung bình cộng điểm các học kỳ chính có đánh giá trong năm học (Điều 6.2)"
    toan_khoa: "trung bình cộng điểm các học kỳ chính có đánh giá của khóa học (Điều 6.3)"

# -----------------------------------------------------------------------------
# KHẢ NĂNG CỦA HỆ THỐNG VỚI TỪNG MỤC (MVP thu thập sự kiện từ nhiều nguồn, CHƯA có xác nhận điểm)
# -----------------------------------------------------------------------------
capabilities:
  sources_in_scope: ["fanpage khoa/Đoàn/Hội", "email sinh viên (Gmail/Outlook) từ đơn vị chính thức"]
  privacy_note: "Chỉ xử lý thư/bài đăng chính thức của trường/đơn vị và khi sinh viên đồng ý rõ ràng; không đọc thư cá nhân."
  classification_boundary:
    activity_vs_participation: "Phân loại (P2) chỉ gán nhãn loại hoạt động/mục tiêu chí cho văn bản sự kiện; KHÔNG chứng minh cá nhân sinh viên đã tham gia hoặc hoàn thành điều kiện (hoàn tất vòng 1, thời lượng, >50% môn...)."
    activity_vs_role_and_credit: "Vai trò cá nhân (BTC/CTV/TNV/Huy động lực lượng) và điều kiện tính điểm/trần nhóm do xác nhận riêng (Module 7) và bộ máy tính điểm tất định (Module 6) quyết định (quyết định D-3)."
  tiers:
    1: {name: "Tìm thấy, đề xuất, ước tính điểm", note: "Bài đăng chính là sự kiện; tham gia đủ điều kiện mới được điểm. Lõi của MVP."}
    2: {name: "Tìm thấy lời kêu gọi, điểm phụ thuộc kết quả", note: "Gợi ý 'có thể ứng tuyển'; điểm chỉ có khi được chọn/hoàn tất (points_condition)."}
    3: {name: "Thành tích — biết sau khi sự việc xảy ra", note: "Không đề xuất được; chờ chức năng tự khai báo sau MVP."}
    4: {name: "Hồ sơ, trạng thái, tuân thủ", note: "Dữ liệu nằm ở hồ sơ học tập/Đoàn–Hội/CTSV; MVP dùng giả định mặc định hoặc bỏ qua."}
    5: {name: "Hoàn cảnh đặc biệt, nhạy cảm", note: "Ngoài phạm vi: không hỏi, không suy đoán, không lưu."}
  mvp_scope:
    recommend: "Phân loại, ước tính điểm dự kiến và đề xuất đầy đủ"
    recommend_apply: "Đề xuất dạng 'ứng tuyển/đăng ký'; điểm hiển thị kèm điều kiện 'nếu được chọn/hoàn tất'"
    assumed_default: "Tính vào điểm nền theo giả định mặc định (sinh viên có thể tắt)"
    remind: "Không phải đề xuất kiếm điểm; nhắc việc bắt buộc để tránh bị trừ điểm"
    track_later: "Chưa xử lý ở MVP; sẽ nhận qua chức năng tự khai báo/minh chứng sau MVP"
    out_of_scope: "Không xử lý"
  verification:
    none: "Hiện chưa có cách xác nhận điểm → mọi điểm chỉ là ước tính"
    planned: "Sau MVP: minh chứng sinh viên tải lên (Module 7) và đối chiếu danh sách do Khoa/Đoàn/Hội cập nhật (Q9)"
  points_condition:               # dùng cho tier 2
    selection_or_completion: "Chỉ có điểm khi được chọn/hoàn tất (1.5, 3.6, 3.11, 3.12, 3.13)"
  ledger:
    sources:
      system_detected: "Hệ thống tìm thấy sự kiện mà sinh viên đăng ký/tham gia (chưa xác nhận)"
      self_reported: "Sinh viên tự khai (chức năng mở rộng sau MVP)"
      assumed_default: "Giả định mặc định, vd không vi phạm (sinh viên có thể tắt)"
    status_levels:
      estimated: "Ước tính — chưa xác nhận"
      confirmed: "Có minh chứng được xác nhận (ngoài phạm vi MVP)"
    mvp_display: [estimated]       # MVP chỉ hiển thị điểm 'dự kiến'
    label_vi: "Ước tính — chưa xác nhận"
    baseline:
      assumed_defaults: [C1.khong_vi_pham_quy_che_dao_tao, C2.khong_vi_pham_noi_quy, C3.khong_vi_pham_te_nan, C4.khong_vi_pham_phap_luat]
      assumed_points_by_group: {C1: 15, C2: 15, C3: 10, C4: 10}   # tổng 50 điểm nền
      manual_group_baseline: optional   # sinh viên có thể nhập điểm hiện có theo từng nhóm để khoảng thiếu điểm chính xác hơn (vd ĐTB, giải thưởng đã có)
      note: "Không có điểm nền thì khoảng thiếu điểm bị thổi phồng tới 50 điểm và đề xuất lệch."
  post_types:                      # phân loại bài đăng/email trước khi phân loại mục
    call_to_action: {mvp: handled, note: "Bài kêu gọi/đăng ký/thông báo sự kiện → dùng để đề xuất"}
    result_announcement: {mvp: deferred, note: "Bài kết quả/vinh danh/danh sách ('chúc mừng', 'đạt giải', 'Danh sách tình nguyện viên...', 'Danh sách ban cán sự...') → gợi ý ghi nhận thành tích/trạng thái; để sau cùng chức năng tự khai báo (quan sát trong events_full.csv ở 4.3 [139], 4.7 [147–150], 5.1 [151])"}

# -----------------------------------------------------------------------------
# NHÓM VÀ TIÊU CHÍ
# -----------------------------------------------------------------------------
groups:
  C1:
    name: "Tham gia học tập và nghiên cứu khoa học"
    max: 30
    tieu_chi: [TC1, TC2, TC3]
    ref: "Điều 4.2.a, Điều 5.1"
  C2:
    name: "Chấp hành nội quy, quy chế và các quy định được áp dụng trong Nhà trường"
    max: 20
    tieu_chi: [TC4]
    ref: "Điều 4.2.b, Điều 5.2"
  C3:
    name: "Tham gia các hoạt động chính trị - xã hội, văn hóa - văn nghệ, thể dục - thể thao; phòng chống tội phạm và các tệ nạn xã hội"
    max: 25
    tieu_chi: [TC5, TC6, TC7]
    ref: "Điều 4.2.c, Điều 5.3"
  C4:
    name: "Hành động hướng đến xây dựng và phát triển cộng đồng"
    max: 25
    tieu_chi: [TC8, TC9, TC10]
    ref: "Điều 4.2.d, Điều 5.4"
  C5:
    name: "Các nội dung khuyến khích"
    max: 30
    tieu_chi: [TC11, TC12, TC13]
    ref: "Điều 4.2.e, Điều 5.5"
  P:
    name: "Điểm trừ"
    max: null                       # không giới hạn
    sign: negative
    ref: "Điều 4.2.f, Phụ lục mục 6"

tieu_chi:
  TC1:  {group: C1, name: "Chấp hành các Quy chế, Quy định liên quan học vụ và khảo thí"}
  TC2:  {group: C1, name: "Có kết quả học tập tốt và sự tiến bộ của mỗi học kỳ"}
  TC3:  {group: C1, name: "Sự chủ động tham gia nghiên cứu khoa học và các hoạt động học thuật ngoại khóa"}
  TC4:  {group: C2, name: "Chấp hành nội quy, quy chế và các quy định được áp dụng trong Nhà trường"}
  TC5:  {group: C3, name: "Sự chủ động tham gia các hoạt động chính trị - xã hội, văn hóa - văn nghệ, thể dục - thể thao"}
  TC6:  {group: C3, name: "Tham gia phòng chống tội phạm và các tệ nạn xã hội trong nhà trường và nơi lưu trú"}
  TC7:  {group: C3, name: "Sự chủ động tham gia xây dựng, đóng góp, quảng bá hình ảnh của Nhà trường và ĐHQG-HCM"}
  TC8:  {group: C4, name: "Chấp hành pháp luật và các văn bản quy phạm pháp luật"}
  TC9:  {group: C4, name: "Sự chủ động tham gia các hoạt động tình nguyện, hành động giải quyết vấn đề xã hội, các hoạt động chung của lớp, khoa và Nhà trường"}
  TC10: {group: C4, name: "Tham gia tuyên truyền các chủ trương của Đảng, chính sách, pháp luật của Nhà nước trong cộng đồng"}
  TC11: {group: C5, name: "Thành tích xuất sắc trong các kỳ thi, cuộc thi và rèn luyện"}
  TC12: {group: C5, name: "Có tinh thần vượt khó, phấn đấu vươn lên trong học tập và cuộc sống"}
  TC13: {group: C5, name: "Các trường hợp có hoàn cảnh đặc biệt"}

