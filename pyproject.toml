[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "no-le-drl"
version = "0.1.0"
description = "Module 3: HCMUS DRL Activity Classification & Personalized Recommendation Engine"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "PyYAML>=6.0",
    "numpy>=1.24",
    "pandas>=2.0",
    "pyarrow>=14.0",
]

[project.optional-dependencies]
ml = [
    "sentence-transformers>=2.7",
    "torch>=2.1",
]
opt = [
    "ortools>=9.8",
]
api = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
]
dev = [
    "pytest>=8.0",
]
all = [
    "no-le-drl[ml,opt,api,dev]",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "configs*", "scripts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v"
