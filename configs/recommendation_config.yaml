# =============================================================================
# Phase 5 Demo Extensions: Demo M4/M6, P5 Hard Filter & P6 Multi-Criteria Scoring
# =============================================================================
input_source:
  mode: database                      # "database" (drl_database.db) | "json" (offline fixture)
  db_path: drl_database.db
  exclude_cancelled: true

rec_embedding:
  fields: [title, description, topic, format]
  passage_prefix: "passage: "
  embeddings_path: data/generated/events_rec_embeddings.npy
  metadata_path: data/generated/events_rec_metadata.json
  reuse_existing: true

demo_module4:
  default_max_travel_min: 45
  comfort_slack_min: 30
  default_pref_hours: [8.0, 21.0]
  fit_weights:
    travel: 0.45
    slack: 0.25
    pref_hours: 0.30
  pref_hours_scores:
    inside: 1.0
    near_1h: 0.7
    outside: 0.3
    missing_time: 0.5
  exam_week_multipliers:
    online: 0.90
    hybrid: 0.70
    offline: 0.45

filter:
  require_predicted_status: true
  strict_max_travel: true
  allow_zero_gain_in_interest_mode: false
  mandatory_bypass_zero_gain: true
  mandatory_bypass_budget: true
  mandatory_bypass_travel: true
  mandatory_bypass_hidden: true

scoring:
  gain:
    p_ref: 10.0
    gap_floor: 0.5
    source_reliability:
      explicit: 1.00
      rule: 0.90
      rule_fallback: 0.80
    fallback_min_weight: 0.7
  interest:
    calibration_mode: "per_user_samples_minmax"  # "per_user_samples_minmax" | "per_user_samples_p1_p99" | "fixed"
    fixed_c_min: 0.72
    fixed_c_max: 0.90
    cold_start_default: 0.50
    event_embedding_fields: ["title", "description", "topic", "format"]
    event_embedding_prefix: "passage: "
    rec_embeddings_path: "data/generated/events_rec_embeddings.npy"
    rec_metadata_path: "data/generated/events_rec_metadata.json"
  input_source:
    default_mode: "database"                     # "database" (drl_database.db) | "json" (offline fixture)
    db_path: "drl_database.db"
    exclude_cancelled: true
  urgency:
    tau_days: 5.0
    missing_deadline_default: 0.20
  penalty_mandatory:
    penalty_ref_points: 20.0
    max_boost: 1.00
    default_mandatory_boost: 0.50
    enable_item_2_2_penalty_link: false

# =============================================================================
# Phase 6: P7 List Selection via MMR (+ 1 Exploration Slot; CP-SAT deferred)
# =============================================================================
selection:
  mmr:
    enabled: true
    top_n: 5
    lambda_param: 0.70                  # Relevance vs Diversity trade-off in [0, 1]
    alpha_semantic: 0.70                # Hybrid Sim = alpha * sim_sem + (1 - alpha) * sim_rubric
    same_item_similarity: 1.00          # sim_rubric when same rubric_item_id
    same_group_similarity: 0.50         # sim_rubric when different item but same parent_group_id
    cosine_rescale_mode: "pool_minmax"  # "pool_minmax" | "fixed" | "none"
    fixed_cos_min: 0.72                 # Empirical e5-small floor when rescaling
    fixed_cos_max: 0.92                 # Empirical e5-small ceiling when rescaling
    min_pool_cosine_span: 0.05          # Minimum pool spread before falling back to fixed range
    enable_exploration_slot: true       # Reserve last slot (when N >= 3 & pool >= N) for Exploration
    exploration_gain_weight: 0.60       # ExploreScore = (w_g*Gain + w_f*Fit) * (1 - max_sim)
    exploration_fit_weight: 0.40
    pin_mandatory: true                 # Pin mandatory events (e.g. 6.4 SHCD) at top of list


